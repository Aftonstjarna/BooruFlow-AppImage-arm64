name: appimage-from-source-arm64

# Builds the Linux ARM64 bundle from this fork (with the arm64 Skia default),
# then packages it as an AnyLinux-style AppImage.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label for the artifact name
        default: '0.13.2+42'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev libepoxy-dev \
            build-essential podman squashfs-tools binutils curl

      - name: Set up SDKs and caches
        uses: ./.github/actions/setup
        with:
          platform: linux-arm64
          rust-targets: aarch64-unknown-linux-gnu

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Package bundle for the AppImage builder
        run: |
          bundle=build/linux/arm64/release/bundle
          test -x "$bundle/booruflow"
          mkdir -p build/input
          tar -C "$bundle" -czf build/input/linux-arm64.tar.gz .

      - name: Collect aarch64 library closure
        run: MODE=full ./tool/appimage/collect-libs.sh

      - name: Audit closure
        run: ./tool/appimage/audit-bundle.sh dist/booruflow-libs-full-aarch64

      - name: Build AppImage
        env:
          VERSION: ${{ inputs.version }}
        run: ./tool/appimage/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: BooruFlow-${{ inputs.version }}-anylinux-aarch64
          path: dist/*.AppImage
          if-no-files-found: error
